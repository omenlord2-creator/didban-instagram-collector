name: Public Instagram Collector

on:
  workflow_dispatch:
  push:
    paths:
      - "collector.py"
      - "requirements.txt"
      - ".github/workflows/collector.yml"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: public-instagram-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect public feeds
        run: python collector.py
      - name: Save collector state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/state.json data/news_web_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public Instagram collection"
            # Concurrent scheduled runs may both update the JSON report.
            # Prefer the report generated by this run when replaying its commit.
            git pull --rebase -X theirs origin main
            git push
          else
            echo "No collector state changes to commit."
          fi
